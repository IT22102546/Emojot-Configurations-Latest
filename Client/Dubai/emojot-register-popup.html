<!--
  SLP – Emojot | Register Interest + Book Session popup
  ------------------------------------------------------
  Paste this whole file into Wix:  Settings → Custom Code → + Add Custom Code
    • Add Code to Pages: the landing page only
    • Place Code in: Body - end
  Any button/link whose text is "Register interest" (or links to #register)
  will open the popup. See README.md for setup.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  .ejr-root {
    --ejr-green-900: #04331d;   /* footer / dark band */
    --ejr-green-700: #3c6e35;   /* section headings   */
    --ejr-teal: #17675b;        /* sub-headings       */
    --ejr-gold: #cfa64b;        /* CTA buttons        */
    --ejr-gold-dark: #b38c35;
    --ejr-gold-soft: #f6eedb;
    --ejr-mint: #eef6f1;        /* "What businesses will gain" panel */
    --ejr-line: #d6e4dc;
    --ejr-text: #2a2a2a;
    --ejr-muted: #5f6b66;
    --ejr-error: #b3261e;
    font-family: "Mulish", "Helvetica Neue", Arial, sans-serif;
    color: var(--ejr-text);
    -webkit-font-smoothing: antialiased;
  }
  .ejr-root *, .ejr-root *::before, .ejr-root *::after { box-sizing: border-box; }

  /* ---------- overlay / modal ---------- */
  .ejr-overlay {
    position: fixed; inset: 0; z-index: 2147483000;
    background: rgba(4, 51, 29, .55);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; opacity: 0; visibility: hidden;
    transition: opacity .25s ease, visibility .25s ease;
  }
  .ejr-overlay.ejr-open { opacity: 1; visibility: visible; }
  .ejr-modal {
    position: relative; width: 100%; max-width: 640px;
    max-height: calc(100vh - 32px); overflow: auto;
    background: #fff; border-radius: 18px;
    box-shadow: 0 24px 60px rgba(4, 51, 29, .35);
    transform: translateY(16px) scale(.98); transition: transform .25s ease;
  }
  .ejr-overlay.ejr-open .ejr-modal { transform: none; }
  .ejr-inline .ejr-modal { max-height: none; box-shadow: none; transform: none; margin: 0 auto; }

  .ejr-head {
    background: var(--ejr-green-900); color: #fff;
    padding: 22px 28px 18px; border-radius: 18px 18px 0 0;
    border-bottom: 3px solid var(--ejr-gold);
  }
  .ejr-brand { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700;
    letter-spacing: .04em; text-transform: uppercase; color: var(--ejr-gold); }
  .ejr-brand img { height: 26px; width: auto; display: block; }
  .ejr-head h2 { margin: 8px 0 4px; font-size: 22px; font-weight: 800; line-height: 1.25; color: #fff; }
  .ejr-head p { margin: 0; font-size: 14px; color: rgba(255,255,255,.82); line-height: 1.5; }
  .ejr-close {
    position: absolute; top: 14px; right: 14px; width: 36px; height: 36px;
    border: 0; border-radius: 50%; background: rgba(255,255,255,.1); color: #fff;
    font-size: 22px; line-height: 1; cursor: pointer; transition: background .2s;
  }
  .ejr-close:hover { background: rgba(255,255,255,.22); }
  .ejr-inline .ejr-close { display: none; }

  /* ---------- stepper ---------- */
  .ejr-steps { display: flex; gap: 8px; padding: 18px 28px 0; list-style: none; margin: 0; }
  .ejr-steps li { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 13px;
    font-weight: 700; color: var(--ejr-muted); }
  .ejr-steps li::after { content: ""; flex: 1; height: 2px; background: var(--ejr-line); border-radius: 2px; }
  .ejr-steps li:last-child { flex: 0 0 auto; }
  .ejr-steps li:last-child::after { display: none; }
  .ejr-num { flex: 0 0 26px; width: 26px; height: 26px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--ejr-mint); color: var(--ejr-teal); font-size: 13px; font-weight: 800; }
  .ejr-steps li.ejr-active { color: var(--ejr-green-900); }
  .ejr-steps li.ejr-active .ejr-num { background: var(--ejr-gold); color: #fff; }
  .ejr-steps li.ejr-done .ejr-num { background: var(--ejr-teal); color: #fff; }
  .ejr-steps li.ejr-done::after { background: var(--ejr-teal); }

  /* ---------- body ---------- */
  .ejr-body { padding: 20px 28px 28px; }
  .ejr-pane[hidden], .ejr-root [hidden] { display: none !important; }
  .ejr-pane h3 { margin: 0 0 4px; font-size: 18px; font-weight: 800; color: var(--ejr-green-700); }
  .ejr-lead { margin: 0 0 18px; font-size: 14px; color: var(--ejr-muted); line-height: 1.5; }

  .ejr-field { margin-bottom: 14px; }
  .ejr-field label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: var(--ejr-teal); }
  .ejr-field label .ejr-req { color: var(--ejr-gold-dark); }
  .ejr-input-wrap { position: relative; }
  .ejr-input-wrap svg { position: absolute; left: 13px; top: 50%; width: 18px; height: 18px;
    transform: translateY(-50%); fill: #8a9a92; pointer-events: none; }
  .ejr-field input {
    width: 100%; height: 46px; padding: 0 14px 0 40px;
    font: inherit; font-size: 15px; color: var(--ejr-text);
    background: #fff; border: 1.5px solid var(--ejr-line); border-radius: 8px;
    outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .ejr-field input::placeholder { color: #9aa7a1; }
  .ejr-field input:focus { border-color: var(--ejr-teal); box-shadow: 0 0 0 3px rgba(23,103,91,.14); }
  .ejr-field.ejr-invalid input { border-color: var(--ejr-error); }
  .ejr-err { display: none; margin-top: 5px; font-size: 12.5px; color: var(--ejr-error); }
  .ejr-field.ejr-invalid .ejr-err { display: block; }
  .ejr-phone { display: flex; }
  .ejr-cc { position: relative; flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    height: 46px; padding: 0 26px 0 12px; background: var(--ejr-mint); color: var(--ejr-green-900);
    border: 1.5px solid var(--ejr-line); border-right: 0; border-radius: 8px 0 0 8px;
    font-size: 14.5px; font-weight: 700; white-space: nowrap; transition: border-color .2s; }
  .ejr-cc::after { content: ""; position: absolute; right: 11px; top: 50%; width: 6px; height: 6px; margin-top: -5px;
    border-right: 2px solid var(--ejr-teal); border-bottom: 2px solid var(--ejr-teal); transform: rotate(45deg); }
  .ejr-cc-flag { font-size: 18px; line-height: 1; }
  .ejr-cc select { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 16px; }
  .ejr-phone input { flex: 1; min-width: 0; padding-left: 12px; border-radius: 0 8px 8px 0; }
  .ejr-phone:focus-within .ejr-cc { border-color: var(--ejr-teal); }
  .ejr-field.ejr-invalid .ejr-cc { border-color: var(--ejr-error); }
  .ejr-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }

  .ejr-hp { position: absolute !important; left: -9999px !important; width: 1px; height: 1px; opacity: 0; }

  .ejr-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    width: 100%; min-height: 48px; padding: 0 22px; border: 0; border-radius: 3px;
    font: inherit; font-size: 15px; font-weight: 700; color: #fff; cursor: pointer;
    background: var(--ejr-gold); transition: background .2s, transform .1s;
    text-decoration: none;
  }
  .ejr-btn:hover { background: var(--ejr-gold-dark); }
  .ejr-btn:active { transform: translateY(1px); }
  .ejr-btn[disabled] { background: #d9cfb6; cursor: not-allowed; }
  .ejr-btn-outline { background: #fff; color: var(--ejr-green-900); border: 1.5px solid var(--ejr-line); }
  .ejr-btn-outline:hover { background: var(--ejr-mint); }
  .ejr-link { background: none; border: 0; padding: 0; font: inherit; font-size: 13.5px; font-weight: 700;
    color: var(--ejr-teal); text-decoration: underline; cursor: pointer; }
  .ejr-hint { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0 0; padding: 12px 14px;
    background: var(--ejr-mint); border-radius: 10px; font-size: 13px; color: var(--ejr-teal); line-height: 1.45; }
  .ejr-hint svg { flex: 0 0 18px; width: 18px; height: 18px; fill: var(--ejr-teal); margin-top: 1px; }
  .ejr-alert { display: none; margin: 0 0 14px; padding: 10px 14px; border-radius: 8px;
    background: #fdecea; color: var(--ejr-error); font-size: 13.5px; }
  .ejr-alert.ejr-show { display: block; }

  /* ---------- booking ---------- */
  .ejr-who { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 16px; padding: 10px 14px; border: 1px dashed var(--ejr-line); border-radius: 10px;
    font-size: 13.5px; color: var(--ejr-muted); }
  .ejr-who strong { color: var(--ejr-green-900); }
  .ejr-book { display: grid; grid-template-columns: 1.15fr 1fr; gap: 18px; }
  .ejr-cal { background: #fff; border: 1.5px solid var(--ejr-line); border-radius: 14px; padding: 14px 14px 12px; }
  .ejr-pick { display: flex; align-items: center; gap: 8px; margin: 0 0 10px; font-size: 14px; font-weight: 800; color: var(--ejr-green-900); }
  .ejr-pick b { width: 22px; height: 22px; border-radius: 50%; background: var(--ejr-green-900); color: #fff;
    display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
  .ejr-cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    padding: 6px; background: var(--ejr-mint); border-radius: 10px; }
  .ejr-cal-head strong { font-size: 15.5px; font-weight: 800; color: var(--ejr-green-900); }
  .ejr-cal-nav { width: 34px; height: 34px; border: 1.5px solid var(--ejr-line); border-radius: 8px; background: #fff;
    color: var(--ejr-green-900); font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer; transition: background .15s, color .15s; }
  .ejr-cal-nav:hover:not([disabled]) { background: var(--ejr-green-900); color: #fff; border-color: var(--ejr-green-900); }
  .ejr-cal-nav[disabled] { opacity: .3; cursor: default; }
  .ejr-cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
  .ejr-dow { font-size: 12px; font-weight: 800; color: var(--ejr-teal); padding: 2px 0 6px; text-transform: uppercase; letter-spacing: .03em; }
  .ejr-dow.ejr-we { color: #a9b6b0; }
  .ejr-day { position: relative; aspect-ratio: 1; min-height: 36px; border: 1.5px solid #b9d5c8; border-radius: 10px;
    background: var(--ejr-mint); font: inherit; font-size: 15px; font-weight: 800; color: var(--ejr-green-900);
    cursor: pointer; transition: background .15s, color .15s, border-color .15s, transform .1s; }
  .ejr-day:hover:not([disabled]):not(.ejr-sel) { background: var(--ejr-teal); border-color: var(--ejr-teal); color: #fff; }
  .ejr-day:active:not([disabled]) { transform: scale(.94); }
  .ejr-day[disabled] { background: transparent; border-color: transparent; color: #c3ccc8; font-weight: 500;
    text-decoration: line-through; cursor: default; }
  .ejr-day.ejr-sel { background: var(--ejr-gold); border-color: var(--ejr-gold-dark); color: #fff;
    box-shadow: 0 4px 10px rgba(179, 140, 53, .4); }
  .ejr-day.ejr-today::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 5px; height: 5px;
    margin-left: -2.5px; border-radius: 50%; background: var(--ejr-gold-dark); }
  .ejr-day.ejr-today.ejr-sel::after { background: #fff; }
  .ejr-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; padding-top: 10px;
    border-top: 1px solid var(--ejr-line); font-size: 12px; color: var(--ejr-muted); }
  .ejr-legend span { display: inline-flex; align-items: center; gap: 6px; }
  .ejr-legend i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .ejr-legend .l-av { background: var(--ejr-mint); border: 1.5px solid #b9d5c8; }
  .ejr-legend .l-sel { background: var(--ejr-gold); }
  .ejr-legend .l-na { background: #eef1f0; }
  .ejr-slots-title { margin: 0 0 4px; font-size: 15px; font-weight: 800; color: var(--ejr-teal); }
  .ejr-tz { margin: 0 0 12px; font-size: 12px; color: var(--ejr-muted); }
  .ejr-slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; max-height: 300px; overflow: auto; padding-right: 2px; }
  .ejr-slot { padding: 10px 6px; border: 1.5px solid #b9d5c8; border-radius: 10px; background: var(--ejr-mint);
    font: inherit; font-size: 14.5px; font-weight: 800; color: var(--ejr-green-900); cursor: pointer; line-height: 1.25;
    transition: background .15s, color .15s, border-color .15s; }
  .ejr-slot small { display: block; margin-top: 2px; font-size: 11px; font-weight: 600; color: var(--ejr-muted); }
  .ejr-slot:hover:not(.ejr-sel) { background: var(--ejr-teal); border-color: var(--ejr-teal); color: #fff; }
  .ejr-slot:hover:not(.ejr-sel) small { color: rgba(255,255,255,.85); }
  .ejr-slot.ejr-sel { background: var(--ejr-gold); border-color: var(--ejr-gold-dark); color: #fff; box-shadow: 0 4px 10px rgba(179, 140, 53, .4); }
  .ejr-slot.ejr-sel small { color: rgba(255,255,255,.9); }
  .ejr-empty { grid-column: 1 / -1; padding: 22px 8px; text-align: center; font-size: 13px; color: var(--ejr-muted);
    border: 1px dashed var(--ejr-line); border-radius: 10px; }
  .ejr-summary { margin: 16px 0 12px; font-size: 14px; color: var(--ejr-teal); font-weight: 700; min-height: 20px; }
  .ejr-actions { display: flex; gap: 12px; align-items: center; }
  .ejr-actions .ejr-btn { flex: 1; }

  /* ---------- success ---------- */
  .ejr-success { text-align: center; padding: 8px 0 4px; }
  .ejr-check { width: 64px; height: 64px; margin: 0 auto 14px; border-radius: 50%;
    background: var(--ejr-mint); display: flex; align-items: center; justify-content: center; }
  .ejr-check svg { width: 32px; height: 32px; fill: var(--ejr-teal); }
  .ejr-when { display: inline-block; margin: 6px 0 18px; padding: 12px 18px; border-radius: 12px;
    background: var(--ejr-gold-soft); color: var(--ejr-green-900); font-weight: 800; font-size: 15px; line-height: 1.45; }
  .ejr-when small { display: block; font-weight: 600; font-size: 12.5px; color: var(--ejr-muted); }
  .ejr-cal-links { display: flex; gap: 10px; margin-bottom: 12px; }
  .ejr-cal-links .ejr-btn { flex: 1; font-size: 14px; min-height: 44px; }

  /* ---------- "don't leave yet" nudge ---------- */
  .ejr-nudge { position: absolute; inset: 0; z-index: 2; display: none; align-items: center; justify-content: center;
    padding: 24px; background: #fff; border-radius: 18px; text-align: center; }
  .ejr-nudge.ejr-show { display: flex; }
  .ejr-nudge-box { max-width: 380px; }
  .ejr-nudge h4 { margin: 0 0 8px; font-size: 19px; font-weight: 800; color: var(--ejr-green-700); }
  .ejr-nudge p { margin: 0 0 18px; font-size: 14px; color: var(--ejr-muted); line-height: 1.5; }
  .ejr-nudge .ejr-btn { margin-bottom: 10px; }

  .ejr-spin-dark { display: inline-block; vertical-align: -4px; margin-right: 6px; border-color: var(--ejr-line); border-top-color: var(--ejr-teal); }
  .ejr-cal.ejr-loading .ejr-cal-grid { opacity: .45; pointer-events: none; }
  .ejr-spin { width: 18px; height: 18px; border: 2.5px solid rgba(255,255,255,.45); border-top-color: #fff;
    border-radius: 50%; animation: ejr-spin .8s linear infinite; }
  @keyframes ejr-spin { to { transform: rotate(360deg); } }

  @media (max-width: 600px) {
    .ejr-overlay { padding: 0; align-items: flex-end; }
    .ejr-modal { max-height: 94vh; border-radius: 18px 18px 0 0; }
    .ejr-head { padding: 20px 20px 16px; }
    .ejr-head h2 { font-size: 19px; padding-right: 30px; }
    .ejr-steps { padding: 16px 20px 0; }
    .ejr-steps .ejr-step-label { display: none; }
    .ejr-steps li.ejr-active .ejr-step-label { display: inline; }
    .ejr-body { padding: 18px 20px 24px; }
    .ejr-grid-2, .ejr-book { grid-template-columns: 1fr; }
    .ejr-slots { grid-template-columns: repeat(3, 1fr); max-height: none; }
    .ejr-cal-links { flex-direction: column; }
  }
  @media (prefers-reduced-motion: reduce) {
    .ejr-overlay, .ejr-modal { transition: none; }
  }
</style>

<script>
(function () {
  if (window.__ejrLoaded) return;
  window.__ejrLoaded = true;

  /* =====================================================================
     CONFIG — edit these values
     ===================================================================== */
  var CONFIG = {
    // Google Apps Script web app URL (see apps-script/ + README). When set, the calendar shows
    // REAL free slots from Google Calendar, bookings create a Calendar event + Google Meet invite,
    // and all emails are sent by the script, so WEB3FORMS_KEY isn't needed.
    BOOKING_API_URL: 'https://script.google.com/macros/s/AKfycbxIL816Kj4hDayjsalUZx_8Mjc_7WjvaEWpGlB1m-eWjMPpt1aM_4iDEBcapLXc-THQfg/exec',

    // Only used when BOOKING_API_URL is empty: free key from https://web3forms.com (enter the inbox that should receive leads).
    // While this is left as-is the form runs in TEST mode (logs to console, sends nothing).
    WEB3FORMS_KEY: 'YOUR_WEB3FORMS_ACCESS_KEY',

    // Send a "lead" email right after step 1, so you still get the contact
    // even if they don't finish booking. A second email follows with the booking.
    EMAIL_ON_REGISTER: true,

    LOGO_URL: '',                       // optional: white/transparent logo for the dark header
    MEETING_TITLE: 'SLP – Emojot introductory session',
    MEETING_MINUTES: 30,

    // Availability (Dubai time, GST = UTC+4, no daylight saving).
    // With BOOKING_API_URL set, the real rules live in the Apps Script CONFIG; keep WORK_DAYS in sync.
    UTC_OFFSET_HOURS: 4,
    TZ_LABEL: 'Dubai time (GST)',
    WORK_DAYS: [1, 2, 3, 4, 5],         // 0=Sun … 6=Sat  (UAE weekend = Sat/Sun)
    DAY_START: '10:00',
    DAY_END: '17:00',                   // last slot starts DAY_END minus MEETING_MINUTES
    SLOT_STEP_MINUTES: 30,
    MIN_NOTICE_HOURS: 18,               // earliest bookable time from "now"
    MAX_DAYS_AHEAD: 30,
    BLOCKED_DATES: [],                  // e.g. ['2026-12-02', '2026-12-03']

    DEFAULT_COUNTRY: 'AE',             // phone country when it can't be guessed from the visitor's timezone
    BLOCK_FREE_EMAIL: false,            // true = reject gmail/yahoo/hotmail… addresses

    // What opens the popup
    TRIGGER_TEXT: /register\s+in?s?terest/i,  // also matches the page typo "insterest"
    TRIGGER_HASH: '#register'
  };
  /* ===================================================================== */

  var API = CONFIG.BOOKING_API_URL;
  var TEST_MODE = !API && (!CONFIG.WEB3FORMS_KEY || CONFIG.WEB3FORMS_KEY.indexOf('YOUR_') === 0);
  var STORE_KEY = 'ejr_lead_v1';
  var FREE_DOMAINS = ['gmail.com','yahoo.com','hotmail.com','outlook.com','live.com','icloud.com','aol.com','msn.com','ymail.com','proton.me','protonmail.com','gmx.com','mail.com'];
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DOW = ['Su','Mo','Tu','We','Th','Fr','Sa'];

  var inline = !/[?&]ejr=popup/.test(location.search) && (window.self !== window.top || !!document.getElementById('ejr-inline'));
  var state = { step: 1, lead: null, date: null, slot: null, viewY: 0, viewM: 0, nudged: false, booked: false,
    avail: null, availAt: 0, availStatus: 'idle' };   // avail = { 'yyyy-mm-dd': [minutes…] } from the API
  var lastFocus = null;

  var ICON = {
    user: '<svg viewBox="0 0 24 24"><path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-8 2-8 5v2h16v-2c0-3-4-5-8-5Z"/></svg>',
    org: '<svg viewBox="0 0 24 24"><path d="M4 21V3h10v4h6v14H4Zm2-2h2v-2H6v2Zm0-4h2v-2H6v2Zm0-4h2V9H6v2Zm0-4h2V5H6v2Zm4 12h2v-2h-2v2Zm0-4h2v-2h-2v2Zm0-4h2V9h-2v2Zm0-4h2V5h-2v2Zm4 12h4v-2h-4v2Zm0-4h4v-2h-4v2Zm0-4h4V9h-4v2Z"/></svg>',
    mail: '<svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5Zm9 7 7-4.5V7l-7 4.5L5 7v.5L12 12Z"/></svg>',
    phone: '<svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>',
    cal: '<svg viewBox="0 0 24 24"><path d="M7 2v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-2V2h-2v2H9V2H7Zm-2 8h14v10H5V10Z"/></svg>',
    check: '<svg viewBox="0 0 24 24"><path d="m9 16.2-4.2-4.2-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2Z"/></svg>'
  };

  function dayAvailable(y, m, d) {
    if (API) { var a = state.avail && state.avail[ymd(y, m, d)]; return !!(a && slotsFor(y, m, d).length); }
    var wd = new Date(Date.UTC(y, m, d)).getUTCDay();
    if (CONFIG.WORK_DAYS.indexOf(wd) < 0) return false;
    if (CONFIG.BLOCKED_DATES.indexOf(ymd(y, m, d)) >= 0) return false;
    var t = dubaiNow();
    var maxDay = Date.UTC(t.y, t.m, t.d + CONFIG.MAX_DAYS_AHEAD);
    if (Date.UTC(y, m, d) > maxDay) return false;

  }

  function slotsFor(y, m, d) {
    var out = [], earliest = Date.now() + CONFIG.MIN_NOTICE_HOURS * 3600e3;
    if (API) {
      return ((state.avail && state.avail[ymd(y, m, d)]) || []).map(function (t) { return { minutes: t, date: dubaiToDate(y, m, d, t) }; })
        .filter(function (s) { return s.date.getTime() >= Date.now(); });
    }
    var end = hm(CONFIG.DAY_END) - CONFIG.MEETING_MINUTES;
    for (var t = hm(CONFIG.DAY_START); t <= end; t += CONFIG.SLOT_STEP_MINUTES) {

    var ok = true, first = null;
    function chk(k, msg) { if (!setErr(k, msg) && ok) { ok = false; first = k; } }
    chk('name', v.name.length < 2 ? 'Please enter your name.' : '');
    chk('company', v.company.length < 2 ? 'Please enter your company name.' : '');
    var domain = (v.email.split('@')[1] || '').toLowerCase();
    chk('email', !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.email) ? 'Please enter a valid email address.'

      : (/[^\d\s()\-.]/.test(v.phone) || nat.length < len[0] || nat.length > len[1])
        ? 'Please enter a valid ' + c.name + ' number' + (len[0] === len[1] ? ' (' + len[0] + ' digits)' : '') + '.' : '');
    if (ok) v.phoneFull = '+' + c.dial + ' ' + nat;
    if (!ok) $('#ejr-' + first).focus();
    return ok ? v : null;
  }

  /* ---------------- Apps Script API ---------------- */
  function apiPost(data) {
    data.botcheck = form.botcheck.checked ? 'on' : '';
    // text/plain avoids a CORS preflight, which Apps Script can't answer
    return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); });
  }
  function leadPayload(l) {
    return { name: l.name, company: l.company, email: l.email, phone: l.phoneFull, country: country(l.country).name,
      visitorTZ: visitorTZ, page: location.href.split('#')[0] };
  }
  function loadAvailability(force) {
    if (!API) return;
    if (state.availStatus === 'loading') return;
    if (!force && state.avail && Date.now() - state.availAt < 120e3) return;
    state.availStatus = 'loading';
    if (state.step === 2) { renderCal(); renderSlots(); }
    fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + 'action=slots&t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.message || j.error);
        state.avail = j.slots || {}; state.availAt = Date.now(); state.availStatus = 'ok';
      })
      .catch(function (err) { console.warn('[Emojot popup] availability failed', err); state.availStatus = 'error'; })
      .then(function () {
        if (state.step !== 2) return;
        if (state.date && !dayAvailable.apply(null, state.date.split('-').map(function (x, i) { return i === 1 ? x - 1 : +x; }))) {
          state.date = null; state.slot = null;
        }
        if (!state.date) { var f = firstAvailableMonth(); state.viewY = f.y; state.viewM = f.m; }
        renderCal(); renderSlots(); renderSummary();
      });
  }

  /* ---------------- email (Web3Forms) ---------------- */
  function send(subject, data) {
    var payload = {
      access_key: CONFIG.WEB3FORMS_KEY,
      subject: subject,
      from_name: 'SLP – Emojot Landing Page',
      replyto: data['Work Email'],
      botcheck: form.botcheck.checked ? 'on' : ''
    };
    for (var k in data) payload[k] = data[k];
    if (TEST_MODE) {
      console.info('[Emojot popup] TEST MODE (set WEB3FORMS_KEY to send). Would email:', payload);
      return new Promise(function (r) { setTimeout(function () { r(true); }, 600); });
    }
    return fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (!j.success) throw new Error(j.message || 'Submission failed');
      return true;
    });
  }

  function leadFields(l) {
    return {
      'Name': l.name, 'Company Name': l.company, 'Work Email': l.email, 'Contact Number': l.phoneFull, 'Country': country(l.country).name,
      'Page': location.href.split('#')[0], 'Visitor timezone': visitorTZ,
      'Submitted at (UTC)': new Date().toISOString().replace('T', ' ').slice(0, 16)
    };
  }

  function busy(btn, on, label) {
    btn.disabled = on;
    if (on) { btn.setAttribute('data-label', btn.innerHTML); btn.innerHTML = '<span class="ejr-spin"></span>' + label; }
    else if (btn.getAttribute('data-label')) btn.innerHTML = btn.getAttribute('data-label');
  }
  function alertMsg(n, msg) {
    var a = $('[data-alert="' + n + '"]');
    a.textContent = msg || ''; a.classList.toggle('ejr-show', !!msg);
  }

  /* ---------------- step 1 submit ---------------- */
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    alertMsg(1, '');
    var v = validate();
    if (!v) return;
    var changed = !state.lead || JSON.stringify(state.lead) !== JSON.stringify(v);
    state.lead = v;
    store({ lead: v });
    if (CONFIG.EMAIL_ON_REGISTER && changed && API) {
      var lp = leadPayload(v); lp.action = 'lead';
      apiPost(lp).catch(function (err) { console.warn('[Emojot popup] lead save failed', err); });
    } else if (CONFIG.EMAIL_ON_REGISTER && changed) {
      var f = leadFields(v);
      f['Status'] = 'REGISTERED, session not booked yet';
      send('New registration: ' + v.company + ' (session pending)', f)
        .catch(function (err) { console.warn('[Emojot popup] lead email failed', err); });
    }
    go(2);
  });

  $all('.ejr-field input').forEach(function (inp) {
    inp.addEventListener('input', function () { setErr(inp.name, ''); });
  });

  /* ---------------- step 2: calendar ---------------- */
  function firstAvailableMonth() {
    var t = dubaiNow();
    for (var i = 0; i <= CONFIG.MAX_DAYS_AHEAD; i++) {
      var dt = new Date(Date.UTC(t.y, t.m, t.d + i));
      if (dayAvailable(dt.getUTCFullYear(), dt.getUTCMonth(), dt.getUTCDate())) return { y: dt.getUTCFullYear(), m: dt.getUTCMonth() };
    }
    return { y: t.y, m: t.m };
  }

  function renderBooking() {
    $('[data-who]').textContent = state.lead.name + ' · ' + state.lead.company;
    if (!state.date) { var f = firstAvailableMonth(); state.viewY = f.y; state.viewM = f.m; }
    renderCal(); renderSlots(); renderSummary();
    loadAvailability();
  }

  function renderCal() {
    var y = state.viewY, m = state.viewM, t = dubaiNow();
    $('[data-month]').textContent = MONTHS[m] + ' ' + y;
    var html = DOW.map(function (d, i) { return '<div class="ejr-dow' + (CONFIG.WORK_DAYS.indexOf(i) < 0 ? ' ejr-we' : '') + '">' + d + '</div>'; }).join('');
    var startDow = new Date(Date.UTC(y, m, 1)).getUTCDay();
    var days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    for (var i = 0; i < startDow; i++) html += '<div></div>';
    for (var d = 1; d <= days; d++) {
      var key = ymd(y, m, d), ok = dayAvailable(y, m, d);
      var cls = 'ejr-day' + (state.date === key ? ' ejr-sel' : '') + (t.y === y && t.m === m && t.d === d ? ' ejr-today' : '');
      html += '<button type="button" class="' + cls + '" data-day="' + key + '"' + (ok ? '' : ' disabled') +
        ' aria-label="' + longDate(y, m, d) + (ok ? '' : ' (unavailable)') + '"' + (state.date === key ? ' aria-pressed="true"' : '') + '>' + d + '</button>';
    }
    $('[data-grid]').innerHTML = html;
    $('.ejr-cal').classList.toggle('ejr-loading', !!API && state.availStatus === 'loading');
    var lastDay = new Date(Date.UTC(t.y, t.m, t.d + CONFIG.MAX_DAYS_AHEAD));
    $('[data-nav="-1"]').disabled = y === t.y && m === t.m;
    $('[data-nav="1"]').disabled = y > lastDay.getUTCFullYear() || (y === lastDay.getUTCFullYear() && m >= lastDay.getUTCMonth());
  }

  function renderSlots() {
    var box = $('[data-slots]');
    if (API && state.availStatus === 'loading' && !state.avail) {
      $('[data-slots-title]').textContent = 'Checking availability…';
      box.innerHTML = '<div class="ejr-empty"><span class="ejr-spin ejr-spin-dark"></span> Loading live availability…</div>';
      return;
    }
    if (API && state.availStatus === 'error' && !state.avail) {
      $('[data-slots-title]').textContent = 'Couldn’t load times';
      box.innerHTML = '<div class="ejr-empty">We couldn’t load available times. <button type="button" class="ejr-link" data-retry>Try again</button></div>';
      return;
    }
    if (API && state.avail && !Object.keys(state.avail).length) {
      $('[data-slots-title]').textContent = 'No times available';
      box.innerHTML = '<div class="ejr-empty">All sessions are currently booked. Please check back soon, or our team will contact you.</div>';
      return;
    }
    if (!state.date) {
      $('[data-slots-title]').textContent = 'Select a date';
      box.innerHTML = '<div class="ejr-empty">Pick a date to see available times.</div>';
      return;
    }
    var p = state.date.split('-'), y = +p[0], m = +p[1] - 1, d = +p[2];
    $('[data-slots-title]').textContent = longDate(y, m, d);
    var slots = slotsFor(y, m, d);
    box.innerHTML = slots.length ? slots.map(function (s) {
      return '<button type="button" class="ejr-slot' + (state.slot === s.minutes ? ' ejr-sel' : '') + '" data-slot="' + s.minutes + '">' +
        fmt12(s.minutes) + (visitorIsDubaiTime ? '' : '<small>' + localTime(s.date) + ' yours</small>') + '</button>';
    }).join('') : '<div class="ejr-empty">No times left on this day. Please choose another date.</div>';
  }

  function selectedDate() {
    if (!state.date || state.slot == null) return null;
    var p = state.date.split('-');
    return dubaiToDate(+p[0], +p[1] - 1, +p[2], state.slot);
  }

  function whenText() {
    var p = state.date.split('-');
    return longDate(+p[0], +p[1] - 1, +p[2]) + ' at ' + fmt12(state.slot) + ' ' + CONFIG.TZ_LABEL.replace(/ \(.*\)/, '');
  }

  function renderSummary() {
    var dt = selectedDate();
    $('[data-summary]').textContent = dt ? '✓ ' + whenText() + (visitorIsDubaiTime ? '' : '  (' + localDateTime(dt) + ' your time)') : '';
    $('[data-confirm]').disabled = !dt;
  }

  root.addEventListener('click', function (e) {
    var t = e.target.closest ? e.target : e.target.parentNode;
    var day = t.closest('[data-day]'), slot = t.closest('[data-slot]'), nav = t.closest('[data-nav]');
    if (day && !day.disabled) { state.date = day.getAttribute('data-day'); state.slot = null; renderCal(); renderSlots(); renderSummary(); }
    else if (slot) { state.slot = +slot.getAttribute('data-slot'); renderSlots(); renderSummary(); }
    else if (nav && !nav.disabled) {
      var m = state.viewM + (+nav.getAttribute('data-nav'));
      state.viewY += Math.floor(m / 12); state.viewM = (m + 12) % 12; renderCal();
    }
    else if (t.closest('[data-retry]')) loadAvailability(true);
    else if (t.closest('[data-edit]')) go(1);
    else if (t.closest('[data-stay]')) nudge.classList.remove('ejr-show');
    else if (t.closest('[data-leave]')) close(true);
    else if (t.closest('[data-done]')) close(true);
    else if (t.closest('.ejr-close')) close(false);
    else if (t === overlay) close(false);
  });

  /* ---------------- step 2 confirm ---------------- */
  $('[data-confirm]').addEventListener('click', function () {
    var btn = this, dt = selectedDate();
    if (!dt) return;
    alertMsg(2, '');
    busy(btn, true, 'Booking…');

    var req;
    if (API) {
      var bp = leadPayload(state.lead);
      bp.action = 'book'; bp.date = state.date; bp.minutes = state.slot;
      bp.visitorLocal = localDateTime(dt) + (visitorTZ ? ' ' + visitorTZ : '');
      req = apiPost(bp).then(function (j) {
        if (j.ok) return j;
        var e = new Error(j.error || 'failed'); e.code = j.error; throw e;
      });
    } else {
      var f = leadFields(state.lead);
      f['Status'] = 'SESSION BOOKED';
      f['Session (Dubai time)'] = whenText();
      f['Session (visitor local time)'] = localDateTime(dt) + (visitorTZ ? ' ' + visitorTZ : '');
      f['Session start (UTC)'] = dt.toISOString();
      f['Duration'] = CONFIG.MEETING_MINUTES + ' minutes';
      req = send('Session booked: ' + state.lead.company + ', ' + whenText(), f).then(function () { return {}; });
    }

    req.then(function (res) {
      busy(btn, false);
      state.booked = true;
      store(null);
      showSuccess(dt, res.meetLink || '');
      go(3);
      if (window.dataLayer) window.dataLayer.push({ event: 'emojot_session_booked' });
    }).catch(function (err) {
      busy(btn, false);
      console.warn('[Emojot popup] booking failed', err);
      if (err.code === 'taken') {
        state.slot = null;
        alertMsg(2, 'Sorry, that time was just booked by someone else. Please choose another time.');
        loadAvailability(true);
        renderSummary();
      } else {
        alertMsg(2, 'Sorry, we couldn’t confirm your booking. Please check your connection and try again.');
      }
    });
  });

  /* ---------------- step 3 ---------------- */
  function icsStamp(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
  function showSuccess(start, meetLink) {
    var end = new Date(start.getTime() + CONFIG.MEETING_MINUTES * 60e3);
    $('[data-thanks]').textContent = 'You’re all set, ' + state.lead.name.split(' ')[0] + '!';
    $('[data-when]').innerHTML = '';
    $('[data-when]').appendChild(document.createTextNode(whenText()));
    if (!visitorIsDubaiTime) {
      var s = document.createElement('small'); s.textContent = localDateTime(start) + ' your time';
      $('[data-when]').appendChild(s);
    }
    if (API) {
      // A real Google Calendar invite (with the Meet link) was sent, so skip the manual "add to calendar" buttons
      $('[data-next]').innerHTML = 'A calendar invite with the Google Meet link has been sent to <strong data-email></strong>.';
      $('.ejr-cal-links').style.display = 'none';
      var mt = $('[data-meet]'); mt.hidden = !meetLink; if (meetLink) mt.href = meetLink;
    }
    $('[data-email]').textContent = state.lead.email;
    var details = 'Online introductory session with the Emojot team.\nThe meeting link will be emailed to you.';
    $('[data-gcal]').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent(CONFIG.MEETING_TITLE) +
      '&dates=' + icsStamp(start) + '/' + icsStamp(end) +
      '&details=' + encodeURIComponent(details);
    var ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Emojot//Register//EN', 'BEGIN:VEVENT',
      'UID:' + Date.now() + '@emojot.com', 'DTSTAMP:' + icsStamp(new Date()),
      'DTSTART:' + icsStamp(start), 'DTEND:' + icsStamp(end),
      'SUMMARY:' + CONFIG.MEETING_TITLE, 'DESCRIPTION:' + details.replace(/\n/g, '\\n'),
      'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
    $('[data-ics]').href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics);
  }

  /* ---------------- keyboard ---------------- */
  document.addEventListener('keydown', function (e) {
    if (inline || !overlay.classList.contains('ejr-open')) return;
    if (e.key === 'Escape') { e.preventDefault(); nudge.classList.contains('ejr-show') ? nudge.classList.remove('ejr-show') : close(false); }
    if (e.key === 'Tab') {
      var scope = nudge.classList.contains('ejr-show') ? nudge : $('.ejr-modal');
      var f = $all('button:not([disabled]), input:not(.ejr-hp), a[href]', scope).filter(function (el) { return el.offsetParent !== null; });
      if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });

  /* ---------------- hook "Register interest" buttons ---------------- */
  function isTrigger(el) {
    if (!el || root.contains(el)) return false;
    var href = el.getAttribute && (el.getAttribute('href') || '');
    if (href && CONFIG.TRIGGER_HASH && href.slice(-CONFIG.TRIGGER_HASH.length) === CONFIG.TRIGGER_HASH) return true;
    if (el.hasAttribute && el.hasAttribute('data-emojot-register')) return true;
    var txt = (el.textContent || el.getAttribute('aria-label') || '').replace(/\s+/g, ' ').trim();
    return txt.length < 40 && CONFIG.TRIGGER_TEXT.test(txt);
  }
  if (!inline) {
    document.addEventListener('click', function (e) {
      var el = e.target && e.target.closest && e.target.closest('a, button, [role="button"], [data-testid="linkElement"]');
      if (!isTrigger(el)) return;
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
      open();
    }, true);
  }

  /* ---------------- mount ---------------- */
  function mount() {
    var host = document.getElementById('ejr-inline');
    (host || document.body).appendChild(root);
    if (inline) {
      var saved = load();
      if (saved && saved.lead) { state.lead = saved.lead; fillForm(saved.lead); go(2); } else go(1);
    } else if (CONFIG.TRIGGER_HASH && location.hash === CONFIG.TRIGGER_HASH) {
      open();
    }
  }
  if (document.body) mount(); else document.addEventListener('DOMContentLoaded', mount);

  window.EmojotRegister = { open: open, close: function () { close(true); } };
})();
</script>
