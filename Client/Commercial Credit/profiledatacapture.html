<style>
.lnksh-cc-title{
    width:100%;
    text-align:left;
    font-size:20px;
    font-weight:600;
    color:#000000;
    font-family:"Saira Semi Condensed", sans-serif;
    margin:20px 0 16px;
}

.lnksh-cc-consent-wrap{
    font-family:"Saira Semi Condensed", sans-serif;
    margin:18px 6px 35px;
    color:#444;
}

.lnksh-cc-consent-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14px;
    line-height:1.35;
    text-align:left;
    cursor:pointer;
}

.lnksh-cc-checkbox{
    margin-top:3px;
    min-width:16px;
    width:16px;
    height:16px;
}

.btn-ok.lnksh-cc-disabled{
    opacity:0.35 !important;
    pointer-events:none !important;
    cursor:not-allowed !important;
}

.lnksh-language-select-hidden {
    position: absolute !important;
    left: -9999px !important;
    width: 1px !important;
    height: 1px !important;
    opacity: 0 !important;
    pointer-events: none !important;
}

.lnksh-language-strip {
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: stretch;
    justify-content: center;
    z-index: 20;
    flex-wrap: wrap;
    max-width: calc(100% - 280px);
}

.lnksh-language-btn {
    width: 174px;
    min-height: 100px;
    padding: 10px 14px;
    border: 1px solid #cfcfcf;
    border-radius: 4px;
    background: rgba(255, 255, 255, 0.8);
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #111111;
    font-family: "Be Vietnam Pro", sans-serif;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}

.lnksh-language-btn:hover {
    border-color: #888888;
    transform: translateY(-1px);
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.14);
}

.lnksh-language-btn.is-active {
    border: 4px solid #000000;
    background: rgba(236, 233, 233, 0.92);
    box-shadow: none;
}

.lnksh-language-badge {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    letter-spacing: 0.5px;
}

.lnksh-language-btn[data-lang-key="en"] .lnksh-language-badge {
    background: linear-gradient(180deg, #ff8c72 0%, #ff3b30 100%);
}

.lnksh-language-btn[data-lang-key="si"] .lnksh-language-badge {
    background: linear-gradient(180deg, #47b2ff 0%, #5f48df 100%);
}

.lnksh-language-btn[data-lang-key="ta"] .lnksh-language-badge {
    background: linear-gradient(180deg, #f8c24a 0%, #e08a12 100%);
}

.lnksh-language-label {
    font-size: 18px;
    font-weight: 600;
    line-height: 1.1;
    text-align: center;
    white-space: nowrap;
}

.loyalty-bottom {
    text-align: center;
    margin-bottom: 40px;
}

</style>

<div class="lnksh-cc-title" data-lnksh-source="commercial-credit-inline">
   <span data-lnksh-key="title">We value your feedback. Kindly provide your details below to help us understand you better.</span>
</div>

<div class="lnksh-cc-consent-wrap" data-lnksh-source="commercial-credit-inline">
    <label class="lnksh-cc-consent-label">
        <input class="lnksh-cc-checkbox" type="checkbox">
        <span data-lnksh-key="consent">
    I consent to the collection and use of my personal information for banking and service improvement purposes, as per applicable privacy policies and regulations.
        </span>
    </label>
</div>

<script>
(function () {
    const COPY = {
        en: {
            title: 'We value your feedback. Kindly provide your details below to help us understand you better.',
            consent: 'I consent to the collection and use of my personal information for banking and service improvement purposes, as per applicable privacy policies and regulation.'
        },
        si: {
            title: 'ඔබගේ ප්‍රතිපෝෂණය අපට වැදගත් වේ. ඔබව වඩා හොඳින් අවබෝධ කර ගැනීමට කරුණාකර පහත ඔබගේ තොරතුරු ලබා දෙන්න.',
            consent: 'අදාළ පෞද්ගලිකත්ව ප්‍රතිපත්ති සහ රෙගුලාසි අනුව, බැංකුකරණ සහ සේවා වැඩිදියුණු කිරීමේ අරමුණු සඳහා මගේ පුද්ගලික තොරතුරු රැස් කිරීම හා භාවිත කිරීම සඳහා මම එකඟ වෙමි.'
        },
        ta: {
            title: 'உங்கள் கருத்து எங்களுக்கு மதிப்புமிக்கது. உங்களை மேலும் நன்கு புரிந்துகொள்ள, கீழே உங்கள் விவரங்களை வழங்கவும்.',
            consent: 'பொருந்தக்கூடிய தனியுரிமைக் கொள்கைகள் மற்றும் விதிமுறைகளின்படி, வங்கி சேவைகள் மற்றும் சேவை மேம்பாட்டு நோக்கங்களுக்காக எனது தனிப்பட்ட தகவல்களை சேகரித்து பயன்படுத்துவதற்கு நான் சம்மதிக்கிறேன்.'
}
    };

    function detectLang() {
        const ngSelect = document.querySelector('select[ng-model="selectedLanguage.value"], select[ng-model*="selectedLanguage"]');
        if (ngSelect) {
            const opt = ngSelect.selectedOptions && ngSelect.selectedOptions[0];
            const v = (opt?.textContent || ngSelect.value || '').toLowerCase();
            if (v.includes('sinhala') || v.includes('සිංහල')) return 'si';
            if (v.includes('tamil') || v.includes('தமிழ்')) return 'ta';
            if (v.includes('english')) return 'en';
        }
        return 'en';
    }

    function apply() {
        const lang = detectLang();
        const copy = COPY[lang] || COPY.en;
        const title = document.querySelector('[data-lnksh-source="commercial-credit-inline"] [data-lnksh-key="title"]');
        const consent = document.querySelector('[data-lnksh-source="commercial-credit-inline"] [data-lnksh-key="consent"]');
        if (title) title.textContent = copy.title;
        if (consent) consent.textContent = copy.consent;
    }

    function getLanguageKey(optionText) {
        const value = (optionText || '').toLowerCase();
        if (value.includes('sinhala') || value.includes('සිංහල')) return 'si';
        if (value.includes('tamil') || value.includes('தமிழ்')) return 'ta';
        return 'en';
    }

    function getBadgeText(langKey, optionText) {
        if (langKey === 'si') return 'සි';
        if (langKey === 'ta') return 'அ';
        return 'E';
    }

    function syncLanguageButtons(ngSelect) {
        const activeText = (ngSelect.selectedOptions && ngSelect.selectedOptions[0] && ngSelect.selectedOptions[0].textContent) || ngSelect.value || '';
        const activeKey = getLanguageKey(activeText);
        document.querySelectorAll('.lnksh-language-btn').forEach((button) => {
            const isActive = button.dataset.langKey === activeKey || button.dataset.langValue === ngSelect.value;
            button.classList.toggle('is-active', isActive);
            button.setAttribute('aria-pressed', isActive ? 'true' : 'false');
        });
    }

    function buildLanguageButtons(ngSelect) {
        if (!ngSelect || document.querySelector('.lnksh-language-strip')) return;

        const options = Array.from(ngSelect.options || []).filter((option) => (option.textContent || option.value || '').trim());
        if (!options.length) return;

        const strip = document.createElement('div');
        strip.className = 'lnksh-language-strip';
        strip.setAttribute('role', 'group');
        strip.setAttribute('aria-label', 'Language selection');

        options.forEach((option) => {
            const langKey = getLanguageKey(option.textContent || option.value);
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'lnksh-language-btn';
            button.dataset.langKey = langKey;
            button.dataset.langValue = option.value;
            button.setAttribute('aria-pressed', 'false');
            button.innerHTML = '<span class="lnksh-language-badge">' + getBadgeText(langKey, option.textContent) + '</span><span class="lnksh-language-label">' + option.textContent.trim() + '</span>';
            button.addEventListener('click', function () {
                ngSelect.value = option.value;
                ngSelect.dispatchEvent(new Event('change', { bubbles: true }));
                syncLanguageButtons(ngSelect);
            });
            strip.appendChild(button);
        });

        const masterSection = document.querySelector('#master-section');
        if (masterSection) {
            masterSection.appendChild(strip);
        } else {
            document.body.appendChild(strip);
        }

        ngSelect.classList.add('lnksh-language-select-hidden');
        syncLanguageButtons(ngSelect);
    }

    function place() {
        const form = document.querySelector('#loyalty-form');
        const okBtn = document.querySelector('.btn-ok');
        const checkbox = document.querySelector('.lnksh-cc-checkbox');
        if (!form || !okBtn || !checkbox) {
            setTimeout(place, 500);
            return;
        }
        const title = document.querySelector('.lnksh-cc-title[data-lnksh-source="commercial-credit-inline"]');
        const consent = document.querySelector('.lnksh-cc-consent-wrap[data-lnksh-source="commercial-credit-inline"]');

        if (title && form.parentNode) form.parentNode.insertBefore(title, form);
        if (consent) form.insertAdjacentElement('afterend', consent);

        okBtn.classList.add('lnksh-cc-disabled');
        okBtn.setAttribute('disabled', 'disabled');

        checkbox.addEventListener('change', function(){
            if (checkbox.checked) { okBtn.classList.remove('lnksh-cc-disabled'); okBtn.removeAttribute('disabled'); }
            else { okBtn.classList.add('lnksh-cc-disabled'); okBtn.setAttribute('disabled','disabled'); }
        });

        // listen language changes
        const ngSelect = document.querySelector('select[ng-model="selectedLanguage.value"], select[ng-model*="selectedLanguage"]');
        buildLanguageButtons(ngSelect);
        if (ngSelect) ngSelect.addEventListener('change', apply);
        if (ngSelect) ngSelect.addEventListener('change', function () { syncLanguageButtons(ngSelect); });
        window.addEventListener('change', (e) => { if (e.target && e.target.tagName === 'SELECT') apply(); }, true);
        window.addEventListener('click', () => setTimeout(apply, 0), true);

        apply();
    }

    window.addEventListener('load', place);

})();
</script>
