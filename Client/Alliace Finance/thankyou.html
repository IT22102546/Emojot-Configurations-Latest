<div class="af-thankyou">
  <div class="af-thankyou-title">Thank You for Your Feedback!</div>
  <div class="af-thankyou-message">We really appreciate you taking the time to share your thoughts with us. Your feedback helps us serve you better every day.</div>
  <button class="af-thankyou-button" type="button" onclick="afCloseSurvey()">Close Survey</button>
</div>

<style>
.af-thankyou {
  max-width: 640px;
  margin: 0 auto;
  padding: 28px 16px;
  text-align: center;
  font-family: Arial, Helvetica, sans-serif;
  color: #111111;
  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.85);
}

.af-thankyou-title {
  color: #f47922;
  font-size: 24px;
  font-weight: 700;
  line-height: 1.25;
  margin-bottom: 10px;
}

.af-thankyou-message {
  font-size: 17px;
  line-height: 1.5;
  margin-bottom: 18px;
}

.af-thankyou-button {
  border: 0;
  border-radius: 999px;
  padding: 11px 24px;
  background: #f47922;
  color: #ffffff;
  cursor: pointer;
  font-family: Arial, Helvetica, sans-serif;
  font-size: 15px;
  font-weight: 700;
  line-height: 1.2;
}

.af-thankyou-button:hover {
  background: #d96612;
}
</style>

<script type="text/javascript">
function afCloseSurvey() {
  var closedPage = '<!doctype html><html><head><meta charset="utf-8"><title>Survey Closed</title><style>body{font-family:Arial,sans-serif;text-align:center;padding:40px;color:#444;}</style></head><body><h2>Survey Closed</h2><p>Thank you for your feedback.</p></body></html>';

  try {
    window.open('', '_self');
    window.close();
  } catch (error) {}

  setTimeout(function () {
    document.open();
    document.write(closedPage);
    document.close();
  }, 150);
}
</script>
