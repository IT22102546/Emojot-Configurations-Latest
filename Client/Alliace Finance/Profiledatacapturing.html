<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600&family=Noto+Serif+Tamil:wght@400;600&display=swap');

.lnksh-cc-title{
    width:100%;
    text-align:left;
    font-size:20px;
    font-weight:600;
    font-family:"Times New Roman", Times, serif;
    margin:20px 0 16px;
    color:#070000 !important;
    opacity:1 !important;
    text-shadow:
        0 1px 2px rgba(0,0,0,0.55),
        0 2px 8px rgba(0,0,0,0.5),
        0 4px 16px rgba(0,0,0,0.4);
}

.lnksh-cc-consent-wrap{
    font-family:"Times New Roman", Times, serif;
    margin:18px 6px 35px;
    color:#ffffff !important;
    opacity:1 !important;
}

.lnksh-cc-consent-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14px;
    line-height:1.35;
    text-align:left;
    cursor:pointer;
    font-family:"Times New Roman", Times, serif;
    color:#ffffff !important;
    opacity:1 !important;
    text-shadow:
        0 1px 2px rgba(0,0,0,0.55),
        0 2px 6px rgba(0,0,0,0.45);
}

.lnksh-cc-checkbox{
    margin-top:3px;
    min-width:16px;
    width:16px;
    height:16px;
    opacity:1 !important;
}

.btn-ok.lnksh-cc-disabled{
    opacity:0.35 !important;
    pointer-events:none !important;
    cursor:not-allowed !important;
}

.loyalty-bottom {
    text-align: center;
    margin-bottom: 40px;
    font-family:"Times New Roman", Times, serif;
}

/* --- Sinhala / Tamil font fixes --- */
.lnksh-cc-title[data-lnksh-lang="si"],
.lnksh-cc-consent-wrap[data-lnksh-lang="si"],
.lnksh-cc-consent-label[data-lnksh-lang="si"] {
    font-family: "Noto Serif Sinhala", sans-serif !important;
    font-weight: 600;
    line-height: 1.5;
}

.lnksh-cc-title[data-lnksh-lang="ta"],
.lnksh-cc-consent-wrap[data-lnksh-lang="ta"],
.lnksh-cc-consent-label[data-lnksh-lang="ta"] {
    font-family: "Noto Serif Tamil", sans-serif !important;
    font-weight: 600;
    line-height: 1.5;
}

.lnksh-cc-title[data-lnksh-lang="si"],
.lnksh-cc-title[data-lnksh-lang="ta"] {
    font-size: 18px;
}

.lnksh-cc-consent-label[data-lnksh-lang="si"],
.lnksh-cc-consent-label[data-lnksh-lang="ta"] {
    font-size: 15px;
}
</style>

<div class="lnksh-cc-title" data-lnksh-source="commercial-credit-inline">
   <span data-lnksh-key="title">We value your feedback. Kindly provide your details below to help us understand you better.</span>
</div>

<div class="lnksh-cc-consent-wrap" data-lnksh-source="commercial-credit-inline">
    <label class="lnksh-cc-consent-label">
        <input class="lnksh-cc-checkbox" type="checkbox">
        <span data-lnksh-key="consent">
    I consent to the collection and use of my personal information for banking and service improvement purposes, as per applicable privacy policies and regulation. 
    </label>
</div>

<script>
(function () {
    const COPY = {
        en: {
            title: 'We Value your Feedback. Kindly provide your details below to help us understand you better.',
            consent: 'I consent to the collection and use of my personal information for banking and service improvement purposes, as per applicable privacy policies and regulation.'
        },
        si: {
            title: 'ඔබගේ ප්‍රතිපෝෂණය අපට වැදගත් වේ. ඔබව වඩා හොඳින් අවබෝධ කර ගැනීමට පහත ඔබගේ තොරතුරු ලබා දීමට කාරුණික වන්න.',
            consent: 'බැංකුකරණ සහ සේවා වැඩිදියුණු කිරීමේ අරමුණු සඳහා, අදාළ පුද්ගලිකත්ව ප්‍රතිපත්ති සහ නියාමන අවශ්‍යතා අනුව, මගේ පුද්ගලික තොරතුරු රැස් කිරීම හා භාවිතය සඳහා මම එකඟ වෙමි.'
        },
        ta: {
            title: 'உங்கள் கருத்து எங்களுக்கு மிகவும் முக்கியமானது. உங்களை மேலும் நன்கு புரிந்துகொள்ள, தயவுசெய்து கீழே உங்கள் விவரங்களை வழங்கவும்.',
            consent: 'பொருந்தக்கூடிய தனியுரிமைக் கொள்கைகள் மற்றும் ஒழுங்குமுறை விதிமுறைகளின்படி, வங்கி சேவைகள் மற்றும் சேவை மேம்பாட்டு நோக்கங்களுக்காக எனது தனிப்பட்ட தகவல்களை சேகரித்து பயன்படுத்துவதற்கு நான் சம்மதிக்கிறேன்.'
        }
    };

    if (typeof window.__lnkshCCCleanup === 'function') {
        try { window.__lnkshCCCleanup(); } catch (e) { /* no-op */ }
        window.__lnkshCCCleanup = null;
    }

    function detectLang() {
        const ngSelect = document.querySelector('select[ng-model="selectedLanguage.value"], select[ng-model*="selectedLanguage"]');
        if (ngSelect) {
            const opt = ngSelect.selectedOptions && ngSelect.selectedOptions[0];
            const v = (opt?.textContent || ngSelect.value || '').toLowerCase();
            if (v.includes('sinhala') || v.includes('සිංහල')) return 'si';
            if (v.includes('tamil') || v.includes('தமிழ்')) return 'ta';
            if (v.includes('english')) return 'en';
        }
        return 'en';
    }

    function apply(titleEl, consentEl) {
        const lang = detectLang();
        const copy = COPY[lang] || COPY.en;
        const titleSpan = titleEl ? titleEl.querySelector('[data-lnksh-key="title"]') : null;
        const consentSpan = consentEl ? consentEl.querySelector('[data-lnksh-key="consent"]') : null;
        if (titleSpan) titleSpan.textContent = copy.title;
        if (consentSpan) consentSpan.textContent = copy.consent;

        if (titleEl) titleEl.setAttribute('data-lnksh-lang', lang);
        if (consentEl) consentEl.setAttribute('data-lnksh-lang', lang);
    }

    function place() {
        const form = document.querySelector('#loyalty-form');
        const okBtn = document.querySelector('.btn-ok');

        const allTitles = document.querySelectorAll('.lnksh-cc-title[data-lnksh-source="commercial-credit-inline"]');
        const allConsents = document.querySelectorAll('.lnksh-cc-consent-wrap[data-lnksh-source="commercial-credit-inline"]');
        const title = allTitles[allTitles.length - 1];
        const consent = allConsents[allConsents.length - 1];
        const checkbox = consent ? consent.querySelector('.lnksh-cc-checkbox') : null;

        if (!form || !okBtn || !title || !consent || !checkbox) {
            setTimeout(place, 500);
            return;
        }

        allTitles.forEach(function (t) { if (t !== title) t.remove(); });
        allConsents.forEach(function (c) { if (c !== consent) c.remove(); });

        if (form.parentNode) form.parentNode.insertBefore(title, form);
        form.insertAdjacentElement('afterend', consent);

        okBtn.classList.add('lnksh-cc-disabled');
        okBtn.setAttribute('disabled', 'disabled');

        function onCheckboxChange() {
            if (checkbox.checked) {
                okBtn.classList.remove('lnksh-cc-disabled');
                okBtn.removeAttribute('disabled');
            } else {
                okBtn.classList.add('lnksh-cc-disabled');
                okBtn.setAttribute('disabled', 'disabled');
            }
        }
        checkbox.addEventListener('change', onCheckboxChange);

        const ngSelect = document.querySelector('select[ng-model="selectedLanguage.value"], select[ng-model*="selectedLanguage"]');
        function onLangChange() { apply(title, consent); }
        if (ngSelect) ngSelect.addEventListener('change', onLangChange);

        function onWindowChange(e) {
            if (e.target && e.target.tagName === 'SELECT') apply(title, consent);
        }
        function onWindowClick() { setTimeout(function () { apply(title, consent); }, 0); }
        window.addEventListener('change', onWindowChange, true);
        window.addEventListener('click', onWindowClick, true);

        window.__lnkshCCCleanup = function () {
            if (ngSelect) ngSelect.removeEventListener('change', onLangChange);
            window.removeEventListener('change', onWindowChange, true);
            window.removeEventListener('click', onWindowClick, true);
            checkbox.removeEventListener('change', onCheckboxChange);
        };

        apply(title, consent);
    }

    if (document.readyState === 'complete') {
        place();
    } else {
        window.addEventListener('load', place);
    }

})();
</script>
