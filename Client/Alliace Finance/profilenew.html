<style id="lnksh-cc-style">
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Sinhala:wght@400;600&family=Noto+Serif+Tamil:wght@400;600&display=swap');

.lnksh-cc-title{
    width:100%;
    text-align:left;
    font-size:20px;
    font-weight:500;
    margin:20px 0 16px;
}

.lnksh-cc-consent-wrap{
    margin:18px 6px 35px;
}

.lnksh-cc-consent-label{
    display:flex;
    align-items:flex-start;
    gap:10px;
    font-size:14px;
    line-height:1.35;
    text-align:left;
    cursor:pointer;
}

.lnksh-cc-checkbox{
    margin-top:3px;
    min-width:16px;
    width:16px;
    height:16px;
    opacity:1 !important;
}

.btn-ok.lnksh-cc-disabled{
    opacity:0.35 !important;
    pointer-events:none !important;
    cursor:not-allowed !important;
}

.loyalty-bottom {
    text-align: center;
    margin-bottom: 40px;
}
</style>

<div class="lnksh-cc-title" data-lnksh-source="commercial-credit-inline">
   <span data-lnksh-key="title">We value your feedback. Kindly provide your details below to help us understand you better.</span>
</div>

<div class="lnksh-cc-consent-wrap" data-lnksh-source="commercial-credit-inline">
    <label class="lnksh-cc-consent-label">
        <input class="lnksh-cc-checkbox" type="checkbox">
        <span data-lnksh-key="consent">
    I consent to the collection and use of my personal information for customer service improvement purposes, in accordance with applicable privacy policies and regulations.
    </label>
</div>

<script>
(function () {
    const COPY = {
        en: {
            title: 'We Value your Feedback. Kindly provide your details below to help us understand you better.',
            consent: 'I consent to the collection and use of my personal information for customer service improvement purposes, in accordance with applicable privacy policies and regulations.',
            fontFamily: '"Times New Roman", Times, serif',
            titleSize: '20px',
            labelSize: '14px'
        },
        si: {
            title: 'ඔබගේ ප්‍රතිපෝෂණය අපට වැදගත් වේ. ඔබව වඩා හොඳින් අවබෝධ කර ගැනීමට පහත ඔබගේ තොරතුරු ලබා දීමට කාරුණික වන්න.',
            consent: 'පවතින පෞද්ගලිකත්ව ප්‍රතිපත්ති සහ අදාළ නියාමනවලට අනුකූලව, පාරිභෝගික සේවාව වැඩිදියුණු කිරීම සඳහා මාගේ පුද්ගලික තොරතුරු රැස් කර භාවිතා කිරීමට මම එකඟ වෙමි.',
            fontFamily: '"Noto Serif Sinhala", sans-serif',
            titleSize: '20px',
            labelSize: '14px'
        },
        ta: {
            title: 'உங்கள் கருத்து எங்களுக்கு மிகவும் முக்கியமானது. உங்களை மேலும் நன்கு புரிந்துகொள்ள, தயவுசெய்து கீழே உங்கள் விவரங்களை வழங்கவும்.',
            consent: 'நடைமுறையில் உள்ள தனியுரிமைக் கொள்கைகள் மற்றும் பொருந்தக்கூடிய விதிமுறைகளுக்கு இணங்க, வாடிக்கையாளர் சேவையை மேம்படுத்தும் நோக்கில் எனது தனிப்பட்ட தகவல்களை சேகரித்து பயன்படுத்துவதற்கு நான் சம்மதிக்கிறேன்.',
            fontFamily: '"Noto Serif Tamil", sans-serif',
            titleSize: '20px',
            labelSize: '14px'
        }
    };

    const SHADOW = '0 1px 2px rgba(0,0,0,0.55), 0 2px 8px rgba(0,0,0,0.5), 0 4px 16px rgba(0,0,0,0.4)';
    const LABEL_SHADOW = '0 1px 2px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.45)';

    if (typeof window.__lnkshCCCleanup === 'function') {
        try { window.__lnkshCCCleanup(); } catch (e) { /* no-op */ }
        window.__lnkshCCCleanup = null;
    }

    function detectLang() {
        const ngSelect = document.querySelector('select[ng-model="selectedLanguage.value"], select[ng-model*="selectedLanguage"]');
        if (ngSelect) {
            const opt = ngSelect.selectedOptions && ngSelect.selectedOptions[0];
            const v = (opt?.textContent || ngSelect.value || '').toLowerCase();
            if (v.includes('sinhala') || v.includes('සිංහල')) return 'si';
            if (v.includes('tamil') || v.includes('தமிழ்')) return 'ta';
            if (v.includes('english')) return 'en';
        }
        return 'en';
    }

    function dedupeStyles() {
        const styles = document.querySelectorAll('style#lnksh-cc-style');
        for (let i = 0; i < styles.length - 1; i++) {
            styles[i].remove();
        }
    }

function forceStyle(titleEl, consentEl, labelEl, consentSpan, lang) {
    const c = COPY[lang] || COPY.en;

    if (titleEl) {
        titleEl.style.setProperty('color', '#ffffff', 'important');
        titleEl.style.setProperty('opacity', '1', 'important');
        titleEl.style.setProperty('font-family', c.fontFamily, 'important');
        titleEl.style.setProperty('font-size', c.titleSize, 'important');
        titleEl.style.setProperty('font-weight', '600', 'important');
        titleEl.style.setProperty('text-shadow', LABEL_SHADOW, 'important');
    }
    if (consentEl) {
        consentEl.style.setProperty('color', '#ffffff', 'important');
        consentEl.style.setProperty('opacity', '1', 'important');
    }
    if (labelEl) {
        labelEl.style.setProperty('color', '#ffffff', 'important');
        labelEl.style.setProperty('opacity', '1', 'important');
        labelEl.style.setProperty('font-family', c.fontFamily, 'important');
        labelEl.style.setProperty('font-size', c.labelSize, 'important');
        labelEl.style.setProperty('font-weight', '600', 'important');
        labelEl.style.setProperty('text-shadow', '0 1px 2px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.45)', 'important');
    }
    if (consentSpan) {
        consentSpan.style.setProperty('color', '#ffffff', 'important');
        consentSpan.style.setProperty('font-family', c.fontFamily, 'important');
        consentSpan.style.setProperty('font-size', c.labelSize, 'important');
        consentSpan.style.setProperty('font-weight', '600', 'important');
        consentSpan.style.setProperty('text-shadow', '0 1px 2px rgba(0,0,0,0.55), 0 2px 6px rgba(0,0,0,0.45)', 'important');
    }
}

function apply(titleEl, consentEl) {
    const lang = detectLang();
    const copy = COPY[lang] || COPY.en;
    const titleSpan = titleEl ? titleEl.querySelector('[data-lnksh-key="title"]') : null;
    const consentSpan = consentEl ? consentEl.querySelector('[data-lnksh-key="consent"]') : null;
    const labelEl = consentEl ? consentEl.querySelector('.lnksh-cc-consent-label') : null;

    if (titleSpan) titleSpan.textContent = copy.title;
    if (consentSpan) consentSpan.textContent = copy.consent;

    forceStyle(titleEl, consentEl, labelEl, consentSpan, lang);
}

    let title, consent;

    function place() {
        dedupeStyles();

        const form = document.querySelector('#loyalty-form');
        const okBtn = document.querySelector('.btn-ok');

        const allTitles = document.querySelectorAll('.lnksh-cc-title[data-lnksh-source="commercial-credit-inline"]');
        const allConsents = document.querySelectorAll('.lnksh-cc-consent-wrap[data-lnksh-source="commercial-credit-inline"]');
        title = allTitles[allTitles.length - 1];
        consent = allConsents[allConsents.length - 1];
        const checkbox = consent ? consent.querySelector('.lnksh-cc-checkbox') : null;

        if (!form || !okBtn || !title || !consent || !checkbox) {
            setTimeout(place, 300);
            return;
        }

        allTitles.forEach(function (t) { if (t !== title) t.remove(); });
        allConsents.forEach(function (c) { if (c !== consent) c.remove(); });

        if (form.parentNode) form.parentNode.insertBefore(title, form);
        form.insertAdjacentElement('afterend', consent);

        okBtn.classList.add('lnksh-cc-disabled');
        okBtn.setAttribute('disabled', 'disabled');

        apply(title, consent);

        function onCheckboxChange() {
            if (checkbox.checked) {
                okBtn.classList.remove('lnksh-cc-disabled');
                okBtn.removeAttribute('disabled');
            } else {
                okBtn.classList.add('lnksh-cc-disabled');
                okBtn.setAttribute('disabled', 'disabled');
            }
        }
        checkbox.addEventListener('change', onCheckboxChange);

        const ngSelect = document.querySelector('select[ng-model="selectedLanguage.value"], select[ng-model*="selectedLanguage"]');
        function onLangChange() { apply(title, consent); }
        if (ngSelect) ngSelect.addEventListener('change', onLangChange);

        function onWindowChange(e) {
            if (e.target && e.target.tagName === 'SELECT') apply(title, consent);
        }
        function onWindowClick() { setTimeout(function () { apply(title, consent); }, 0); }
        window.addEventListener('change', onWindowChange, true);
        window.addEventListener('click', onWindowClick, true);

        // Simple, safe safety-net: reapply text/styles every 1.5s.
        // This alone (no MutationObserver) is what caused crashes before,
        // so this is the only re-apply mechanism now.
        const pollId = setInterval(function () {
            if (!document.contains(title) || !document.contains(consent)) {
                clearInterval(pollId);
                place();
                return;
            }
            const dupTitles = document.querySelectorAll('.lnksh-cc-title[data-lnksh-source="commercial-credit-inline"]');
            const dupConsents = document.querySelectorAll('.lnksh-cc-consent-wrap[data-lnksh-source="commercial-credit-inline"]');
            if (dupTitles.length > 1 || dupConsents.length > 1) {
                clearInterval(pollId);
                place();
                return;
            }
            apply(title, consent);
        }, 1000);

        window.__lnkshCCCleanup = function () {
            if (ngSelect) ngSelect.removeEventListener('change', onLangChange);
            window.removeEventListener('change', onWindowChange, true);
            window.removeEventListener('click', onWindowClick, true);
            checkbox.removeEventListener('change', onCheckboxChange);
            clearInterval(pollId);
        };
    }

    if (document.readyState === 'complete') {
        place();
    } else {
        window.addEventListener('load', place);
    }

})();
</script>
