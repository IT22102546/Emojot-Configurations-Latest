/* =========================================================

}

    /* =========================================================

    const ALL_STAFF = [

    /* =========================================================
       NORMALIZE TEXT
       ========================================================= */

    function normalize(value) {

        return (value || "")
            .toLowerCase()
            .replace(/[^a-z0-9\s]/g, " ")
            .replace(/\s+/g, " ")
            .trim();
    }


    /* =========================================================
       INJECT STAFF GRID CSS
       ========================================================= */

    function addStaffCSS() {

        if (
            document.getElementById(
                "mtn-staff-filter-style"
            )
        ) {

        }


        const style =
            document.createElement("style");


        style.id =
            "mtn-staff-filter-style";


        style.textContent = `

            /* ================================================
               STAFF GRID - DESKTOP
               ================================================ */

            #mtn-store-staff-grid {

                display: grid !important;

                grid-template-columns:
                    repeat(3, minmax(0, 1fr)) !important;

            }


            #mtn-store-staff-grid
            > .emo-cont {

                flex-direction:

            }

            @media (min-width: 769px) {

                #mtn-store-staff-grid.last-row-1
                > .emo-cont:last-child {

                    grid-column:

                }


                /* ============================================
                   DESKTOP:
                   TWO CARDS LEFT -> CENTER THE PAIR
                   ============================================ */

                #mtn-store-staff-grid.last-row-2
                > .emo-cont:nth-last-child(2) {

                    position:

                    left:
                        50% !important;
                }


                #mtn-store-staff-grid.last-row-2
                > .emo-cont:last-child {

                    position:

                }
            }


            /* ================================================

            @media (max-width: 768px) {

                #mtn-store-staff-grid {

                    grid-template-columns:

                    gap:

                #mtn-store-staff-grid
                > .emo-cont {

                    position:

                /* ============================================

                    grid-column:

    /* =========================================================
       GET STORE
       ========================================================= */

    function detectStoreFromText(value) {

        const text = normalize(value);

        if (!text) {
            return "";
        }

        /* Alberton short URL is /albertoncitymall, while the
           EmoSignature/store value is Alberton City Mall L111. */
        if (
            text.includes("alberton city mall l111") ||
            text.includes("albertoncitymalll111") ||
            text.includes("albertoncitymall")
        ) {
            return "alberton city mall l111";
        }

        if (
            text.includes("eastgate shopping centre l33") ||
            text.includes("eastgateshoppingcentrel33")
        ) {
            return "eastgate shopping centre l33";
        }

        if (
            (text.includes("mall of the south") && text.includes("f066")) ||
            text.includes("mallofthesouthf066")
        ) {
            return "mall of the south f066";
        }

        if (
            (text.includes("the glen shopping centre") && text.includes("m44")) ||
            text.includes("theglenshoppingcentrem44")
        ) {
            return "the glen shopping centre m44";
        }

        if (
            (text.includes("eastgate shopping centre") && text.includes("u76b")) ||
            text.includes("eastgateshoppingcentreu76b")
        ) {
            return "eastgate shopping centre u76b";
        }

        return "";
    }


    function decodeEmoSignatureFromUrl() {

        try {
            const params = new URLSearchParams(window.location.search);
            const encoded = params.get("emoSignature");

            if (!encoded) {
                return "";
            }

            let base64 = encoded
                .replace(/-/g, "+")
                .replace(/_/g, "/");

            while (base64.length % 4) {
                base64 += "=";
            }

            return decodeURIComponent(
                Array.prototype.map.call(
                    atob(base64),
                    function (c) {
                        return "%" +
                            ("00" + c.charCodeAt(0).toString(16)).slice(-2);
                    }
                ).join("")
            );

        } catch (e) {
            return "";
        }
    }


    function getStore() {

        /* =====================================================
           1. EMOJOT EMOSIGNATURE VALUE
           ===================================================== */

        const signatureStore =
            "$emosignature_store_value";

        let detected =
            detectStoreFromText(signatureStore);

        if (detected) {
            return detected;
        }


        /* =====================================================
           2. DECODE emoSignature DIRECTLY FROM FINAL URL

           This is important for emo.run short links. After the
           redirect, the token can still exist in mobile.jsp even
           when $emosignature_store_value is not ready yet.
           ===================================================== */

        detected =
            detectStoreFromText(
                decodeEmoSignatureFromUrl()
            );

        if (detected) {
            return detected;
        }


        /* =====================================================
           3. SENSOR TITLE
           ===================================================== */

        const sensorTitle =
            document.querySelector(
                ".sensor-title"
            );

        if (sensorTitle) {

            detected =
                detectStoreFromText(
                    sensorTitle.textContent
                );

            if (detected) {
                return detected;
            }
        }


        /* =====================================================
           4. CURRENT / REDIRECTED URL
           ===================================================== */

        detected =
            detectStoreFromText(
                window.location.href
            );

        if (detected) {
            return detected;
        }


        /* =====================================================
           5. SHORT-LINK REFERRER

           When emo.run redirects to emojot.com, browsers normally
           keep the emo.run URL as document.referrer. This catches:

           /theglenshoppingcentreM44
           /mallofthesouthF066
           /eastgateshoppingcentreU76B
           /eastgateshoppingcentreL33
           /albertoncitymall
           ===================================================== */

        detected =
            detectStoreFromText(
                document.referrer
            );

        if (detected) {
            return detected;
        }


        /* =====================================================
           6. EXPLICIT SHORT-URL SLUG FALLBACK
           ===================================================== */

        const urlSources = [
            String(window.location.href || "").toLowerCase(),
            String(document.referrer || "").toLowerCase()
        ].join(" ");

        if (urlSources.includes("theglenshoppingcentrem44")) {
            return "the glen shopping centre m44";
        }

        if (urlSources.includes("mallofthesouthf066")) {
            return "mall of the south f066";
        }

        if (urlSources.includes("eastgateshoppingcentreu76b")) {
            return "eastgate shopping centre u76b";
        }

        if (urlSources.includes("eastgateshoppingcentrel33")) {
            return "eastgate shopping centre l33";
        }

        if (urlSources.includes("albertoncitymall")) {
            return "alberton city mall l111";
        }


        return "";
    }


    /* =========================================================
       GET CARD NAME
       ========================================================= */

    function getCardName(card) {

        const text =
            card.querySelector(
                ".emo-text"
            );


        if (!text) {
            return "";
        }


        return normalize(
            text.textContent
        );
    }


    /* =========================================================
       GET ALL STAFF + COMMON OPTION CARDS
       ========================================================= */

    function getRelevantCards() {

        return Array.from(
            document.querySelectorAll(
                ".emo-cont"
            )
        ).filter(function (card) {

            const name =
                getCardName(card);


            return (
                ALL_STAFF.includes(name) ||
                COMMON_OPTIONS.includes(name)
            );
        });
    }


    /* =========================================================
       HIDE EMPTY NATIVE TITLE
       ========================================================= */

    function hideEmptyNativeTitle(
        container
    ) {

        if (!container) {
            return;
        }


        container
            .querySelectorAll(
                ".emote-title"
            )
            .forEach(
                function (title) {

                    if (
                        normalize(
                            title.textContent
                        ) === ""
                    ) {

                        title.style.setProperty(
                            "display",
                            "none",
                            "important"
                        );
                    }
                }
            );
    }


    /* =========================================================
       APPLY FILTER
       ========================================================= */

    function applyStaffFilter() {

        addStaffCSS();


        const store =
            getStore();


        if (
            !store ||
            !STORE_STAFF[store]
        ) {
            return;
        }


        const cards =
            getRelevantCards();


        if (!cards.length) {
            return;
        }


        const allowedStaff =
            STORE_STAFF[store];


        /* =====================================================
           MATCH STAFF FOR CURRENT STORE
           ===================================================== */

        const matchingStaffCards =
            cards.filter(
                function (card) {

                    return allowedStaff.includes(
                        getCardName(card)
                    );
                }
            );


        /*
         * Safety:
         * don't blank the page if no staff matched.
         */
        if (!matchingStaffCards.length) {

            console.warn(
                "MTN staff filter: no staff matched for:",
                store
            );

            return;
        }


        /* =====================================================
           FIND "NOT SURE"
           ===================================================== */

        const commonCards =
            cards.filter(
                function (card) {

                    return COMMON_OPTIONS.includes(
                        getCardName(card)
                    );
                }
            );


        /* =====================================================
           FIND QUESTION CONTAINER
           ===================================================== */

        const firstRow =
            matchingStaffCards[0].closest(
                ".flex"
            );


        if (!firstRow) {
            return;
        }


        const container =
            firstRow.parentElement;


        if (!container) {
            return;
        }


        container.classList.add(
            "mtn-staff-question"
        );


        hideEmptyNativeTitle(
            container
        );


        /* =====================================================
           ORDER STORE STAFF
           ===================================================== */

        const orderedStaffCards =
            allowedStaff
                .map(
                    function (name) {

                        return matchingStaffCards.find(
                            function (card) {

                                return (
                                    getCardName(card) ===
                                    name
                                );
                            }
                        );
                    }
                )
                .filter(Boolean);


        /*
         * FINAL ORDER:
         *
         * Store staff first
         * "Not Sure" always last.
         */
        const orderedCards = [
            ...orderedStaffCards,
            ...commonCards
        ];


        if (!orderedCards.length) {
            return;
        }


        /* =====================================================
           CREATE / FIND GRID
           ===================================================== */

        let grid =
            container.querySelector(
                "#mtn-store-staff-grid"
            );


        if (!grid) {

            grid =
                document.createElement(
                    "div"
                );


            grid.id =
                "mtn-store-staff-grid";


            container.appendChild(
                grid
            );
        }


        /* =====================================================
           RESET LAYOUT CLASSES
           ===================================================== */

        grid.classList.remove(
            "last-row-1",
            "last-row-2",
            "last-row-0",
            "mobile-odd",
            "mobile-even"
        );


        const total =
            orderedCards.length;


        const desktopRemainder =
            total % 3;


        if (
            desktopRemainder === 1
        ) {
            grid.classList.add(
                "last-row-1"
            );
        }

        else if (
            desktopRemainder === 2
        ) {
            grid.classList.add(
                "last-row-2"
            );
        }

        else {
            grid.classList.add(
                "last-row-0"
            );
        }


        if (
            total % 2 === 1
        ) {
            grid.classList.add(
                "mobile-odd"
            );
        }

        else {
            grid.classList.add(
                "mobile-even"
            );
        }


        /* =====================================================
           HIDE ALL STAFF + NOT SURE
           ===================================================== */

        cards.forEach(
            function (card) {

                card.style.setProperty(
                    "display",
                    "none",
                    "important"
                );
            }
        );


        /* =====================================================
           SHOW CURRENT STORE STAFF + NOT SURE
           ===================================================== */

        orderedCards.forEach(
            function (card) {

                grid.appendChild(
                    card
                );


                card.style.removeProperty(
                    "display"
                );


                card.classList.add(
                    "mtn-staff-card"
                );
            }
        );


        /* =====================================================
           HIDE ORIGINAL EMOJOT ROWS
           ===================================================== */

        Array.from(
            container.querySelectorAll(
                ":scope > .flex"
            )
        ).forEach(
            function (row) {

                if (
                    !row.contains(grid)
                ) {

                    row.style.setProperty(
                        "display",
                        "none",
                        "important"
                    );
                }
            }
        );


        hideEmptyNativeTitle(
            container
        );


        container.dataset.staffStore =
            store;
    }


    /* =========================================================
       RUN
       ========================================================= */

    function run() {

        applyStaffFilter();


        setTimeout(
            applyStaffFilter,
            100
        );


        setTimeout(
            applyStaffFilter,
            300
        );


        setTimeout(
            applyStaffFilter,
            700
        );


        setTimeout(
            applyStaffFilter,
            1200
        );
    }


    if (
        document.readyState ===
        "loading"
    ) {

        document.addEventListener(
            "DOMContentLoaded",
            run
        );

    } else {

        run();
    }


    /* =========================================================
       WATCH EMOJOT DYNAMIC PAGE CHANGES
       ========================================================= */

    let timer;


    const observer =
        new MutationObserver(
            function () {

                clearTimeout(
                    timer
                );


                timer =
                    setTimeout(
                        applyStaffFilter,
                        80
                    );
            }
        );


    observer.observe(
        document.documentElement,
        {
            childList: true,
            subtree: true
        }
    );

})();
